[project]
name = "empty"
version = "0.0.1"
description = "Empty Jac project - start from scratch"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.7"

[byllm]
[byllm.model]
default_model = "${LLM_MODEL:-claude-sonnet-5}"
api_key = "${ANTHROPIC_API_KEY:-}"


[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "red"
font = "geist"
radius = "default"
menuAccent = "bold"
menuColor = "default"
[dependencies]
[dependencies.npm]
"@fontsource-variable/geist" = "*"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
"@hookform/resolvers" = "^5.2.2"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
"@hugeicons/react" = "*"
"@hugeicons/core-free-icons" = "*"
"@radix-ui/react-slot" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/inter" = "*"
shadcn = "^3.8.5"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@base-ui/react" = "*"
cmdk = "*"
embla-carousel-react = "*"
input-otp = "*"
react-day-picker = "*"
react-resizable-panels = "*"
recharts = "*"
sonner = "*"
vaul = "*"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"
tailwindcss = "latest"
"@tailwindcss/vite" = "latest"



[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[client]
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "A blank canvas"
description = "A minimal jac-shadcn starter with the theme wired up and nothing in the way."
keywords = "jac, starter, shadcn, template"
author = "Blank canvas"
theme_color = "#dc7702"
og_type = "website"
og_title = "A blank canvas"
og_description = "A minimal jac-shadcn starter."
og_site_name = "Blank canvas"


[scale]
[scale.microservices]
enabled = false

[jacpack]
name = 'AirLock'
description = 'Jac IDE snapshot for AirLock'
